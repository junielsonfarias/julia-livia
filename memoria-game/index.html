<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memoria - Mundo de Julia & Livia</title>
    <base href="/memoria-game/">
    <link rel="stylesheet" href="styles.css?v=f8df7fcf">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <button class="back-btn" onclick="goBack()">&#8592; Voltar</button>
            <h1>Jogo da Memoria</h1>
            <div class="game-stats">
                <span class="moves">Jogadas: <strong id="moves-count">0</strong></span>
                <span class="pairs">Pares: <strong id="pairs-count">0</strong>/<strong id="total-pairs">6</strong></span>
            </div>
        </header>

        <main class="game-area">
            <!-- Tela de Inicio -->
            <div id="start-screen" class="screen active">
                <div class="start-content">
                    <div class="start-col start-intro">
                    <div class="game-icon">🧠</div>
                    <h2>Jogo da Memoria!</h2>
                    <p>Encontre os pares e divirta-se!</p>
                    <button class="intro-hear" type="button" onclick="speakIntro()">🔊 Ouvir como joga</button>

                    <!-- Seletor de Modo -->
                    <div class="mode-section">
                        <h3>Como vamos jogar?</h3>
                        <div class="mode-selector">
                            <button class="mode-pick selected" data-mode="solo" onclick="selectMode('solo')">
                                <span class="theme-icon">🙋</span>
                                <span class="theme-name">Sozinha</span>
                            </button>
                            <button class="mode-pick" data-mode="duel" onclick="selectMode('duel')">
                                <span class="theme-icon">⚔️</span>
                                <span class="theme-name">Duelo Julia × Livia</span>
                            </button>
                        </div>
                        <div id="duel-options" class="duel-options" hidden>
                            <div class="duel-history" id="duel-history"></div>
                            <label class="duel-rule">
                                <input type="checkbox" id="opt-extra-turn">
                                Quem acerta um par joga de novo
                            </label>
                        </div>
                    </div>
                    </div>

                    <div class="start-col start-options">
                    <!-- Seletor de Tema -->
                    <div class="theme-section">
                        <h3>Escolha um tema:</h3>
                        <div id="theme-selector" class="theme-selector">
                            <!-- Botoes de tema serao inseridos via JavaScript -->
                        </div>
                    </div>

                    <!-- Seletor de Dificuldade -->
                    <div class="difficulty-select">
                        <h3>Escolha o nivel:</h3>
                        <button class="level-btn" data-level="easy" onclick="startGame('easy')">
                            <span class="level-icon">🐣</span>
                            <span class="level-name">Fácil</span>
                            <span class="level-desc">6 pares</span>
                        </button>
                        <button class="level-btn" data-level="medium" onclick="startGame('medium')">
                            <span class="level-icon">🐥</span>
                            <span class="level-name">Médio</span>
                            <span class="level-desc">8 pares</span>
                        </button>
                        <button class="level-btn" data-level="hard" onclick="startGame('hard')">
                            <span class="level-icon">🦅</span>
                            <span class="level-name">Difícil</span>
                            <span class="level-desc">10 pares</span>
                        </button>
                    </div>
                    </div>
                </div>
            </div>

            <!-- Tela do Jogo -->
            <div id="game-screen" class="screen">
                <!-- Placar do duelo -->
                <div id="duel-board" class="duel-board" hidden>
                    <div class="player-panel julia" id="panel-julia">
                        <span class="player-emoji">👸</span>
                        <span class="player-name">Julia</span>
                        <span class="player-score" id="score-julia">0</span>
                    </div>
                    <div class="turn-banner" id="turn-banner">Vez da Julia!</div>
                    <div class="player-panel livia" id="panel-livia">
                        <span class="player-emoji">🧚</span>
                        <span class="player-name">Livia</span>
                        <span class="player-score" id="score-livia">0</span>
                    </div>
                </div>
                <div id="feedback-toast" class="feedback-toast"></div>
                <div id="cards-grid" class="cards-grid">
                    <!-- Cards serao inseridos via JavaScript -->
                </div>
            </div>

            <!-- Tela de Vitoria -->
            <div id="win-screen" class="screen">
                <div class="win-content">
                    <div class="win-icon">🎉</div>
                    <h2>Parabens!</h2>
                    <p>Voce encontrou todos os pares!</p>
                    <div class="win-stats">
                        <div class="stat">
                            <span class="stat-label">Jogadas</span>
                            <span class="stat-value" id="final-moves">0</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Tempo</span>
                            <span class="stat-value" id="final-time">0:00</span>
                        </div>
                    </div>
                    <div class="duel-result" id="duel-result" hidden>
                        <div class="duel-final">
                            <div class="final-player julia"><span>👸 Julia</span><strong id="final-julia">0</strong><small>pares</small></div>
                            <div class="final-vs">×</div>
                            <div class="final-player livia"><span>🧚 Livia</span><strong id="final-livia">0</strong><small>pares</small></div>
                        </div>
                        <div class="duel-history" id="duel-history-end"></div>
                    </div>
                    <div class="stars-earned" id="stars-display">
                        <span class="star">⭐</span>
                        <span class="star">⭐</span>
                        <span class="star">⭐</span>
                    </div>
                    <div class="win-buttons">
                        <button class="play-again-btn" onclick="restartGame()">Jogar Novamente</button>
                        <button class="menu-btn" onclick="goToMenu()">Menu</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../shared/kids-audio.js?v=da92b96a"></script>
    <script src="game.js?v=04d53c40"></script>
    <script src="../shared/fit-screen.js?v=0f4dccb7"></script>
</body>
</html>
