<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequência Lógica - Mundo de Julia & Livia</title>
    <base href="/sequencia-game/">
    <link rel="stylesheet" href="styles.css?v=906ef679">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <button class="back-btn" onclick="goBack()">&#8592; Voltar</button>
            <h1>Sequência Lógica</h1>
            <div class="game-stats">
                <span class="score">Pontos: <strong id="score">0</strong></span>
                <span class="level">Nível: <strong id="current-level">1</strong></span>
            </div>
        </header>

        <main class="game-area">
            <!-- Tela de Inicio -->
            <div id="start-screen" class="screen active">
                <div class="start-content">
                    <div class="game-icon">🧩</div>
                    <h2>Sequência Lógica!</h2>
                    <p>Descubra a regra escondida, como nas olimpíadas de matemática!</p>

                    <div class="mode-select">
                        <button class="mode-btn" onclick="startGame('numbers')">
                            <span class="mode-icon">🔢</span>
                            <span class="mode-name">Números</span>
                            <span class="mode-desc">Sequências numéricas</span>
                        </button>
                        <button class="mode-btn" onclick="startGame('patterns')">
                            <span class="mode-icon">🎨</span>
                            <span class="mode-name">Padrões</span>
                            <span class="mode-desc">Padrões de formas</span>
                        </button>
                        <button class="mode-btn" onclick="startGame('mixed')">
                            <span class="mode-icon">🌟</span>
                            <span class="mode-name">Desafio</span>
                            <span class="mode-desc">Tudo misturado!</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tela do Jogo -->
            <div id="game-screen" class="screen">
                <div class="question-area">
                    <div class="question-text" id="question-text">Complete a sequência:</div>
                    <div class="sequence-display" id="sequence-display">
                        <!-- Sequencia sera mostrada aqui -->
                    </div>
                </div>

                <div class="options-area" id="options-area">
                    <!-- Opcoes serao inseridas via JavaScript -->
                </div>

                <div class="feedback" id="feedback"></div>
                <div class="explain" id="explain"></div>
                <button class="next-btn" id="next-btn" onclick="goNext()" hidden>Próxima ➜</button>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <!-- Tela de Vitoria -->
            <div id="win-screen" class="screen">
                <div class="win-content">
                    <div class="win-icon">🏆</div>
                    <h2>Fantástico!</h2>
                    <p id="level-message">Você completou o nível!</p>
                    <div class="final-score">
                        <span class="score-label">Pontuação</span>
                        <span class="score-value" id="final-score">0</span>
                    </div>
                    <div class="stars-earned" id="stars-display">
                        <span class="star">⭐</span>
                        <span class="star">⭐</span>
                        <span class="star">⭐</span>
                    </div>
                    <div class="win-buttons">
                        <button class="next-btn" onclick="nextLevel()">Próximo nível ➜</button>
                        <button class="menu-btn" onclick="goToMenu()">Menu</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../shared/kids-audio.js?v=9ae1984f"></script>
    <script src="game.js?v=a954e379"></script>
    <script src="../shared/fit-screen.js?v=14ec2899"></script>
</body>
</html>
