<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo dos Animais - Mundo de Julia & Livia</title>
    <base href="/animais-game/">
    <link rel="stylesheet" href="styles.css?v=1c771496">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <button class="back-btn" onclick="goBack()">&#8592; Voltar</button>
            <h1>Jogo dos Animais</h1>
            <div class="game-stats">
                <span class="score">Pontos: <strong id="score">0</strong></span>
            </div>
        </header>

        <main class="game-area">
            <!-- Tela de Inicio -->
            <div id="start-screen" class="screen active">
                <div class="start-content">
                    <div class="animals-preview">
                        <span>🐶</span>
                        <span>🦁</span>
                        <span>🐬</span>
                    </div>
                    <h2>Jogo dos Animais!</h2>
                    <p>Escolha como quer brincar:</p>

                    <div class="mode-select">
                        <button class="mode-btn sounds-mode" onclick="startGame('sounds')">
                            <span class="mode-icon">🔊</span>
                            <div class="mode-info">
                                <span class="mode-name">Sons dos Animais</span>
                                <span class="mode-desc">Ouça e encontre o animal!</span>
                            </div>
                        </button>
                        <button class="mode-btn habitat-mode" onclick="startGame('habitat')">
                            <span class="mode-icon">🏡</span>
                            <div class="mode-info">
                                <span class="mode-name">Onde Mora?</span>
                                <span class="mode-desc">Descubra onde os animais vivem!</span>
                            </div>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tela do Jogo -->
            <div id="game-screen" class="screen">
                <div class="game-content">
                    <div class="question-area">
                        <div class="question-text" id="question-text">Qual animal faz esse som?</div>
                        <button class="sound-btn" id="sound-btn" onclick="playAnimalSound()">
                            <span class="sound-icon">🔊</span>
                            <span>Ouvir</span>
                        </button>
                        <div class="sound-text" id="sound-text"></div>
                    </div>

                    <div class="animals-grid" id="animals-grid">
                        <!-- Animais/Habitats aparecerao aqui -->
                    </div>

                    <div class="feedback" id="feedback"></div>

                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>
            </div>

            <!-- Tela de Vitoria -->
            <div id="win-screen" class="screen">
                <div class="win-content">
                    <div class="win-icon">🏆</div>
                    <h2>Parabéns!</h2>
                    <p>Você conhece os animais!</p>
                    <div class="final-score">
                        <span class="score-label">Pontuação</span>
                        <span class="score-value" id="final-score">0</span>
                    </div>
                    <div class="stars-earned" id="stars-display">
                        <span class="star">⭐</span>
                        <span class="star">⭐</span>
                        <span class="star">⭐</span>
                    </div>
                    <div class="win-buttons">
                        <button class="next-btn" onclick="playAgain()">Jogar de Novo</button>
                        <button class="menu-btn" onclick="goToMenu()">Menu</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../shared/kids-audio.js?v=884d58e9"></script>
    <script src="game.js?v=7c0533b9"></script>
</body>
</html>
