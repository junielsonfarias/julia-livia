<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprender a Contar - Mundo de Julia & Livia</title>
    <base href="/contar-game/">
    <link rel="stylesheet" href="styles.css?v=a48afe82">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <button class="back-btn" onclick="goBack()">&#8592; Voltar</button>
            <h1>Aprender a Contar</h1>
            <div class="game-stats">
                <span class="score">Pontos: <strong id="score">0</strong></span>
                <span class="stars">&#11088; <strong id="stars">0</strong></span>
            </div>
        </header>

        <main class="game-area">
            <!-- Tela de Inicio -->
            <div id="start-screen" class="screen active">
                <div class="start-content">
                    <div class="start-intro">
                    <div class="counting-preview">
                        <span>1</span>
                        <span>2</span>
                        <span>3</span>
                    </div>
                    <h2>Vamos Contar!</h2>
                    <p>Conte os objetos e escolha o número certo!</p>
                    <div class="hear-row"><button class="hear-btn" type="button" onclick="speakIntro()">🔊 Ouvir como joga</button></div>
                    </div>

                    <div class="start-modes">

                    <h3 class="section-title">Modo Contar:</h3>
                    <div class="mode-select">
                        <button class="mode-btn" onclick="startGame('easy')">
                            <span class="mode-icon">🐣</span>
                            <span class="mode-name">Fácil</span>
                            <span class="mode-desc">1 a 5</span>
                        </button>
                        <button class="mode-btn" onclick="startGame('medium')">
                            <span class="mode-icon">🐥</span>
                            <span class="mode-name">Médio</span>
                            <span class="mode-desc">1 a 10</span>
                        </button>
                        <button class="mode-btn" onclick="startGame('hard')">
                            <span class="mode-icon">🦅</span>
                            <span class="mode-name">Difícil</span>
                            <span class="mode-desc">1 a 20</span>
                        </button>
                    </div>

                    <h3 class="section-title">Modo Comparar:</h3>
                    <div class="mode-select">
                        <button class="mode-btn compare" onclick="startCompareGame('easy')">
                            <span class="mode-icon">🤔</span>
                            <span class="mode-name">Qual tem mais?</span>
                            <span class="mode-desc">Fácil</span>
                        </button>
                        <button class="mode-btn compare" onclick="startCompareGame('medium')">
                            <span class="mode-icon">🧐</span>
                            <span class="mode-name">Qual tem mais?</span>
                            <span class="mode-desc">Médio</span>
                        </button>
                    </div>
                    </div>
                </div>
            </div>

            <!-- Tela do Jogo -->
            <div id="game-screen" class="screen">
                <div class="game-content">
                    <div class="question-text" id="question-text">Quantos tem?</div>
                    <div class="hear-row"><button class="hear-btn" onclick="repeatPrompt()">🔊 Ouvir</button></div>

                    <div class="objects-display" id="objects-display">
                        <!-- Objetos aparecerao aqui -->
                    </div>

                    <div class="options-area" id="options-area">
                        <!-- Opcoes de numeros -->
                    </div>

                    <div class="feedback" id="feedback"></div>

                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>
            </div>

            <!-- Tela de Vitoria -->
            <div id="win-screen" class="screen">
                <div class="win-content">
                    <div class="win-icon">🎉</div>
                    <h2>Muito Bem!</h2>
                    <p>Você sabe contar!</p>
                    <div class="final-score">
                        <span class="score-label">Pontuação</span>
                        <span class="score-value" id="final-score">0</span>
                    </div>
                    <div class="stars-earned" id="stars-display">
                        <span class="star">⭐</span>
                        <span class="star">⭐</span>
                        <span class="star">⭐</span>
                    </div>
                    <div class="win-buttons">
                        <button class="next-btn" onclick="playAgain()">Jogar de Novo</button>
                        <button class="menu-btn" onclick="goToMenu()">Menu</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../shared/kids-audio.js?v=da92b96a"></script>
    <script src="game.js?v=02de8264"></script>
    <script src="../shared/fit-screen.js?v=0f4dccb7"></script>
</body>
</html>
