<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monte a Palavra - Mundo de Julia & Livia</title>
    <base href="/silabas-game/">
    <link rel="stylesheet" href="../leitura-game/styles.css">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="silabas">
    <div class="game-container">
        <header class="game-header">
            <button class="back-btn" onclick="goBack()">&#8592; Voltar</button>
            <h1>🧩 Monte a Palavra</h1>
            <div class="round-info"><b id="round">1</b>/<span id="total">10</span></div>
        </header>

        <main class="game-area">
            <section id="start-screen" class="screen active">
                <div class="panel">
                    <div class="big-icon">🧩</div>
                    <h2>Monte a Palavra!</h2>
                    <p class="lead">Olhe a figura, ouça a palavra e toque nas <b>sílabas</b> na ordem certa.</p>
                    <h3>Escolha o tamanho:</h3>
                    <div class="mode-grid">
                        <button class="mode-btn m2" onclick="startGame(2)"><span class="mode-sample"><i>GA</i><i>TO</i></span><span class="mode-name">2 sílabas</span></button>
                        <button class="mode-btn m3" onclick="startGame(3)"><span class="mode-sample"><i>BO</i><i>NE</i><i>CA</i></span><span class="mode-name">3 sílabas</span></button>
                        <button class="mode-btn m4" onclick="startGame(4)"><span class="mode-sample"><i>PI</i><i>RU</i><i>LI</i><i>TO</i></span><span class="mode-name">4 sílabas</span></button>
                        <button class="mode-btn mv" onclick="startGame('variadas')"><span class="mode-sample">🎲</span><span class="mode-name">Variadas</span></button>
                    </div>
                </div>
            </section>

            <section id="game-screen" class="screen">
                <div class="word-card build-card">
                    <div class="build-picture" id="picture">🐱</div>
                    <button class="act listen hear-btn" onclick="sayWord()">🔊 Ouvir</button>
                    <div class="slots" id="slots"></div>
                </div>
                <div class="tiles" id="tiles"></div>
            </section>

            <section id="result-screen" class="screen">
                <div class="panel">
                    <div class="big-icon">🎉</div>
                    <h2>Muito bem!</h2>
                    <p class="lead">Você montou <b id="done-count">10</b> palavras.</p>
                    <div class="stars" id="stars"></div>
                    <p class="lead" id="result-msg"></p>
                    <div class="btn-row">
                        <button class="big-btn primary" onclick="startGame(state.mode)">Jogar de novo</button>
                        <button class="big-btn" onclick="showScreen('start-screen')">Mudar modo</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="../shared/kids-audio.js"></script>
    <script src="../shared/palavras.js"></script>
    <script src="game.js"></script>
</body>
</html>
